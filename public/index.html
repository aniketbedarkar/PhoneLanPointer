<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>LAN Air Mouse</title>
    <style>
        body {
            background: black;
            color: white;
            font-family: sans-serif;
            text-align: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            user-select: none;
            touch-action: none;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .hint {
            opacity: 0.7;
            font-size: 30px;
            margin-top: 20px;
        }

        p {
            font-size: larger;
        }
    </style>
</head>

<body>
    <h1>🖱️ LAN Air Mouse</h1>
    <p>Tap once to start, then tilt to move the cursor</p>
    <p class="hint">Tap again to left-click</p>
    <script src="script.js"></script>
</body>

</html>
